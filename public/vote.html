<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abstimmung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Systemisches Konsensieren</p>
    <h1 class="font-display" id="questionText">Lade Abstimmung …</h1>
  </header>

  <div id="loadError" class="card hidden" style="color:var(--bad)"></div>

  <div id="closedArea" class="stack hidden">
    <div class="card">
      <p class="pill pill-accent" style="margin-bottom:.5rem">Abstimmung beendet</p>
      <p style="color:var(--text-muted)">Deine Stimme kann nicht mehr geändert werden. Hier ist das Ergebnis:</p>
    </div>
    <div id="resultsList" class="stack"></div>
  </div>

  <div id="votingArea" class="stack hidden">
    <div class="card">
      <p style="font-size:.9rem;color:var(--text-muted)">Bewerte jede Option nach deinem Widerstand dagegen: <strong style="color:var(--text)">0 = kein Widerstand</strong> · <strong style="color:var(--text)">10 = maximaler Widerstand</strong>.</p>
    </div>

    <div id="optionsArea" class="stack"></div>

    <div class="row-between">
      <p id="submitStatus" style="font-size:.85rem;color:var(--text-muted)"></p>
      <button id="submitBtn" class="btn btn-accent">
        Stimme abgeben
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var boardId = window.location.pathname.split("/").filter(Boolean).pop();
  var voterKey = "sk_voter_" + boardId;
  var voterId = localStorage.getItem(voterKey);
  if(!voterId){
    voterId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    try{ localStorage.setItem(voterKey, voterId); }catch(e){}
  }

  var draftKey = "sk_draft_" + boardId;
  var draft = {};
  try{ draft = JSON.parse(localStorage.getItem(draftKey) || "{}"); }catch(e){ draft = {}; }

  var board = null;

  function resistanceColor(v){
    if(v <= 3) return { fg: "var(--good)", bg: "var(--good-soft)" };
    if(v <= 6) return { fg: "var(--warn)", bg: "var(--warn-soft)" };
    return { fg: "var(--bad)", bg: "var(--bad-soft)" };
  }

  function renderOptions(){
    var area = document.getElementById("optionsArea");
    area.innerHTML = "";
    board.options.forEach(function(opt){
      if(!(opt.id in draft)) draft[opt.id] = 0;

      var card = document.createElement("div");
      card.className = "card stack";
      card.style.gap = ".6rem";

      var top = document.createElement("div");
      top.className = "row-between";
      var nameWrap = document.createElement("div");
      nameWrap.className = "row";
      var nameEl = document.createElement("p");
      nameEl.style.fontWeight = "600";
      nameEl.textContent = opt.name;
      nameWrap.appendChild(nameEl);
      if(opt.isNull){
        var tag = document.createElement("span");
        tag.className = "pill";
        tag.style.fontSize = ".68rem";
        tag.textContent = "Status Quo";
        nameWrap.appendChild(tag);
      }
      top.appendChild(nameWrap);

      var score = document.createElement("span");
      score.className = "score-badge";
      score.id = "score_" + opt.id;
      top.appendChild(score);
      card.appendChild(top);

      if(opt.isNull){
        var nullHint = document.createElement("p");
        nullHint.style.fontSize = ".8rem";
        nullHint.style.color = "var(--text-muted)";
        nullHint.style.margin = "-.3rem 0 0";
        nullHint.textContent = "Wir tun nichts – alles bleibt genau so, wie es gerade ist.";
        card.appendChild(nullHint);
      }

      var slider = document.createElement("input");
      slider.type = "range";
      slider.min = "0"; slider.max = "10"; slider.step = "1";
      slider.value = String(draft[opt.id]);
      slider.className = "sk-slider";
      slider.addEventListener("input", function(){
        draft[opt.id] = Number(slider.value);
        updateScoreBadge(opt.id);
        try{ localStorage.setItem(draftKey, JSON.stringify(draft)); }catch(e){}
      });
      card.appendChild(slider);

      var scale = document.createElement("div");
      scale.className = "row-between font-mono";
      scale.style.fontSize = ".68rem";
      scale.style.color = "var(--text-muted)";
      scale.innerHTML = "<span>0 · kein Widerstand</span><span>10 · max. Widerstand</span>";
      card.appendChild(scale);

      area.appendChild(card);
      updateScoreBadge(opt.id);
    });
  }

  function updateScoreBadge(optId){
    var el = document.getElementById("score_" + optId);
    if(!el) return;
    var v = draft[optId] || 0;
    el.textContent = v;
    var c = resistanceColor(v);
    el.style.color = c.fg;
    el.style.background = c.bg;
  }

  function renderResults(){
    var container = document.getElementById("resultsList");
    container.innerHTML = "";
    var rows = (board.results && board.results.rows) || [];

    if(!rows.length || board.voterCount === 0){
      var empty = document.createElement("p");
      empty.className = "card";
      empty.style.color = "var(--text-muted)";
      empty.textContent = "Es wurden keine Stimmen abgegeben.";
      container.appendChild(empty);
      return;
    }

    var maxSum = Math.max.apply(null, rows.map(function(r){ return r.sum; }).concat([1]));

    rows.forEach(function(row, idx){
      var isBest = idx === 0;
      var wrap = document.createElement("div");
      wrap.className = "card stack";
      wrap.style.gap = ".55rem";
      if(isBest){
        wrap.style.borderColor = "var(--good)";
        wrap.style.background = "var(--good-soft)";
        wrap.style.boxShadow = "0 0 0 1.5px var(--good), var(--shadow)";
      }

      var top = document.createElement("div");
      top.className = "row-between";

      var left = document.createElement("div");
      left.className = "row";
      left.style.minWidth = "0";

      var rank = document.createElement("span");
      rank.className = "font-mono";
      rank.style.fontSize = ".75rem";
      rank.style.fontWeight = "600";
      rank.style.color = isBest ? "var(--good)" : "var(--text-muted)";
      rank.textContent = "#" + (idx+1);
      left.appendChild(rank);

      var nameEl = document.createElement("p");
      nameEl.style.fontWeight = "600";
      nameEl.textContent = row.name;
      left.appendChild(nameEl);

      if(isBest){
        var badge = document.createElement("span");
        badge.className = "pill";
        badge.style.color = "var(--good)";
        badge.style.borderColor = "var(--good)";
        badge.style.background = "var(--surface)";
        badge.textContent = "Geringster Widerstand";
        left.appendChild(badge);
      } else if(row.isNull){
        var tag = document.createElement("span");
        tag.className = "pill";
        tag.style.fontSize = ".68rem";
        tag.textContent = "Status Quo";
        left.appendChild(tag);
      }
      top.appendChild(left);

      var nums = document.createElement("div");
      nums.className = "row font-mono";
      nums.style.fontSize = ".78rem";
      nums.style.color = "var(--text-muted)";
      nums.innerHTML = '<span>Ø <strong style="color:var(--text);font-size:.95rem">' + row.avg.toFixed(1) + '</strong></span>' +
        '<span>Σ <strong style="color:var(--text)">' + row.sum + '</strong></span>';
      top.appendChild(nums);

      wrap.appendChild(top);

      var track = document.createElement("div");
      track.className = "bar-track";
      var fill = document.createElement("div");
      fill.className = "bar-fill";
      var pct = maxSum > 0 ? Math.max(4, (row.sum / maxSum) * 100) : 0;
      fill.style.width = pct + "%";
      fill.style.background = isBest ? "var(--good)" : resistanceColor(row.avg).fg;
      track.appendChild(fill);
      wrap.appendChild(track);

      container.appendChild(wrap);
    });
  }

  async function loadBoard(){
    try{
      var res = await fetch("/api/boards/" + boardId);
      var data = await res.json();
      if(!res.ok){ throw new Error(data.error || "Abstimmung nicht gefunden."); }
      board = data;
      document.getElementById("questionText").textContent = board.question;

      if(board.status === "results"){
        document.getElementById("votingArea").classList.add("hidden");
        document.getElementById("closedArea").classList.remove("hidden");
        renderResults();
      } else {
        document.getElementById("closedArea").classList.add("hidden");
        document.getElementById("votingArea").classList.remove("hidden");
        renderOptions();
      }
    }catch(e){
      document.getElementById("loadError").textContent = "Fehler: " + e.message;
      document.getElementById("loadError").classList.remove("hidden");
    }
  }

  document.getElementById("submitBtn").addEventListener("click", async function(){
    var btn = this;
    var statusEl = document.getElementById("submitStatus");
    btn.disabled = true;
    try{
      var res = await fetch("/api/boards/" + boardId + "/vote", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Voter-Id": voterId },
        body: JSON.stringify({ scores: draft })
      });
      var data = await res.json();
      if(!res.ok){ throw new Error(data.error || "Fehler beim Absenden."); }
      statusEl.style.color = "var(--good)";
      statusEl.textContent = "Danke, deine Stimme wurde gezählt. Du kannst sie jederzeit hier erneut ändern.";
    }catch(e){
      statusEl.style.color = "var(--bad)";
      statusEl.textContent = "Fehler: " + e.message;
    }finally{
      btn.disabled = false;
    }
  });

  loadBoard();
  // sanft prüfen, ob die Abstimmung inzwischen beendet wurde
  setInterval(loadBoard, 6000);
})();
</script>
</body>
</html>
